<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorCiv — Customize</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div class="page">
  <section class="panel">
    <h2>Colour scheme</h2>
    <div class="scheme-choice" role="radiogroup" aria-label="Colour scheme">
      <label class="scheme-opt">
        <input type="radio" name="scheme" value="dark">
        <span class="scheme-swatch dark" aria-hidden="true"></span> Dark
      </label>
      <label class="scheme-opt">
        <input type="radio" name="scheme" value="light">
        <span class="scheme-swatch light" aria-hidden="true"></span> Light
      </label>
    </div>
    <p class="muted small">Saved as soon as you choose, for every browser you sign in on. The game
    and replay pages keep their dark map colours.</p>
    <p class="settings-msg" id="settings-msg" role="status"></p>
  </section>
</div>

<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/customize.js"></script>
</body>
</html>
