<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorCiv — Lobby</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="page">
  <section class="panel">
    <h2>New game</h2>
    <p class="muted small">Four civilizations. You take one seat; the others are played by the
    server. Open seats for other people come later.</p>
    <div id="seat-rows" class="seat-rows"></div>
    <div class="form-row">
      <label>Seed <input id="seed-input" type="number" min="0" step="1"></label>
      <button id="seed-random" type="button">Random</button>
      <label>Turn time <select id="turn-time"></select></label>
      <button id="start-btn" class="primary" type="button">Start game</button>
      <span id="new-game-error" class="form-error"></span>
    </div>
  </section>

  <section class="panel">
    <h2>My games <span class="count" id="games-count"></span></h2>
    <div id="games-list" class="list"><p class="muted empty">Loading…</p></div>
  </section>
</div>

<!-- The engine's catalogues give the civ names, colours and settings lists;
     shell.js builds the chrome; authGuard.js must load after it. -->
<script src="/js/hex.js"></script>
<script src="/js/state.js"></script>
<script src="/js/mapgen.js"></script>
<script src="/js/game.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/lobby.js"></script>
</body>
</html>
