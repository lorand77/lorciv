<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LorCiv — Replay</title>
<link rel="stylesheet" href="/css/game.css">
</head>
<body class="replay">

<canvas id="game-canvas"></canvas>
<div id="scoreboard" class="hidden"></div>

<aside id="sidebar">
    <div class="panel" id="head-panel">
        <a class="brand" href="/lobby.html">⬡ LorCiv</a>
        <div id="userbar"></div>
    </div>
    <div class="panel">
        <div id="turn-label">Replay</div>
        <div id="status-line">Loading…</div>
        <div id="replay-progress" class="muted"></div>
    </div>
    <div class="panel" id="players-panel">
        <div class="section-label">Players</div>
        <div id="players-list"></div>
    </div>
    <div class="panel" id="replay-controls">
        <div class="section-label">Step</div>
        <input id="step" type="range" min="0" max="0" value="0" step="1">
        <div id="step-label" class="muted"></div>
        <div class="btn-row">
            <button id="first-btn" title="Start">⏮</button>
            <button id="prev-btn" title="Back one (←)">◀</button>
            <button id="play-btn" title="Play (space)">▶ Play</button>
            <button id="next-btn" title="Forward one (→)">▶</button>
            <button id="last-btn" title="End">⏭</button>
        </div>
        <div class="stat-row">Speed
            <select id="speed">
                <option value="1200">slow</option>
                <option value="600" selected>normal</option>
                <option value="200">fast</option>
            </select>
        </div>
    </div>
    <div style="flex:1"></div>
    <div class="panel">
        <a class="button-link" id="game-link" href="#">Open the game</a>
    </div>
</aside>

<div id="tooltip"></div>

<!-- The engine, the AI (replays re-run it), the replay module, the renderer. -->
<script src="/js/hex.js"></script>
<script src="/js/state.js"></script>
<script src="/js/mapgen.js"></script>
<script src="/js/game.js"></script>
<script src="/js/ai.js"></script>
<script src="/js/snapshot.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/actions.js"></script>
<script src="/js/replay.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/authGuard.js"></script>
<script src="/js/replay-page.js"></script>
</body>
</html>
